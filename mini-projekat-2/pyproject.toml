[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-experiment-framework"
version = "1.0.0"
description = "A small extensible ML experiment framework demonstrating GoF design patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.2", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
